<script>
new PartnersCoupang.G({"id":997904,"template":"carousel","trackingCode":"AF7522335","width":"900","height":"140","tsource":""});
</script>
</div>
<script>
(function(){
  function scaleAd(){
    var o=document.getElementById('cpout997904{{ .Ordinal }}');
    if(!o) return;
    var ow=o.offsetWidth;
    if(ow>0 && ow<900){
      var s=ow/900;
      var inner=o.firstElementChild;
      if(inner){inner.style.transformOrigin='0 0';inner.style.transform='scale('+s+')';}
      o.style.height=Math.round(140*s)+'px';
    }
  }
  if(document.readyState==='complete'){scaleAd();}
  else{window.addEventListener('load',scaleAd);}
})();
</script>
