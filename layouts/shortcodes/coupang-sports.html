<div style="margin:2em 0;overflow:hidden;max-width:100%;" id="cpwrap997905{{ .Ordinal }}">
<iframe src="https://ads-partners.coupang.com/widgets.html?id=997905&template=carousel&trackingCode=AF7522335&subId=&width=900&height=140&tsource=" width="900" height="140" frameborder="0" scrolling="no" referrerpolicy="unsafe-url" browsingtopics></iframe>
</div>
<script>
(function(){
  function scaleAd(){
    var wrap=document.getElementById('cpwrap997905{{ .Ordinal }}');
    if(!wrap) return;
    var ow=wrap.offsetWidth;
    var iframe=wrap.querySelector('iframe');
    if(!iframe||ow<=0||ow>=900) return;
    var s=ow/900;
    iframe.style.transformOrigin='0 0';
    iframe.style.transform='scale('+s+')';
    wrap.style.height=Math.round(140*s)+'px';
  }
  if(document.readyState==='complete'){scaleAd();}else{window.addEventListener('load',scaleAd);}
})();
</script>
